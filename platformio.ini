; SwoopR RF Detector — PlatformIO project config

[platformio]
default_envs = swooper
src_dir      = src
include_dir  = include
test_dir     = test

; ESP32-S3-N16R8: 16 MB flash, 8 MB PSRAM
[env:swooper]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size   = 16MB
board_upload.flash_size  = 16MB
board_build.partitions   = default_16MB.csv

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    olikraus/U8g2
    bblanchon/ArduinoJson

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3

; Host-side unit tests — no hardware required
[env:native]
platform         = native
test_framework   = unity

build_src_filter =
    +<device_registry.*>
    +<threat_engine.*>
    +<whitelist_store.*>

build_flags =
    -D NATIVE_TEST
    -I test/stubs
